<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Binary-Brain: Autonomous Agentic E-Commerce & Inventory Ecosystem for Neural Hardware, AI Accelerators, and Robotics.">
  <title>Binary-Brain | Autonomous E-Commerce & Inventory Ecosystem</title>
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Header & Navigation Bar Container -->
  <div id="header-navigation"></div>

  <!-- Main View Router Container -->
  <main class="main-container">
    <!-- 1. Product Catalogue View -->
    <div id="catalog-view" class="view-section"></div>

    <!-- 2. Checkout View -->
    <div id="checkout-view" class="view-section" style="display: none;"></div>

    <!-- 3. Orders & Tracking View -->
    <div id="orders-view" class="view-section" style="display: none;"></div>

    <!-- 4. Customer Profile View -->
    <div id="profile-view" class="view-section" style="display: none;"></div>

    <!-- 5. Admin Dashboard View -->
    <div id="admin-view" class="view-section" style="display: none;"></div>
  </main>

  <!-- Global UI Overlays -->
  <!-- Auth Modal Container -->
  <div id="auth-modal-container"></div>

  <!-- Product Details Modal Container -->
  <div id="product-details-container"></div>

  <!-- Cart Side Drawer Container -->
  <div id="cart-drawer-container"></div>

  <!-- Notifications Drawer Container -->
  <div id="notifications-drawer-container"></div>

  <!-- AI Chat Widget Container -->
  <div id="ai-chat-container"></div>

  <!-- Toast Alerts Container -->
  <div id="toast-container"></div>

  <!-- Main Application Script -->
  <script type="module" src="app.js"></script>
</body>
</html>
