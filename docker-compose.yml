version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: binary_brain_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: binary_brain_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: binary_brain_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/binary_brain_db
      JWT_SECRET: binary_brain_super_secure_jwt_secret_2026
    ports:
      - "5000:5000"
    depends_on:
      - postgres

volumes:
  pgdata:
